<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <style>
      .lane { fill: #f8fafc; stroke: #475569; stroke-width: 2; }
      .lane-title { font: 700 24px "Arial", sans-serif; fill: #0f172a; }
      .task { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 8; }
      .event { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .end { stroke-width: 5; }
      .gateway { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .flow { fill: none; stroke: #222; stroke-width: 2; marker-end: url(#arrow); }
      .label { font: 18px "Arial", sans-serif; fill: #111827; }
      .small { font: 16px "Arial", sans-serif; fill: #111827; }
      .icon { font: 22px "Arial", sans-serif; fill: #111827; }
      .caption { font: 700 26px "Arial", sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect x="20" y="20" width="1760" height="560" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="900" y="62" text-anchor="middle" class="caption">BPMN-діаграма процесу контролю доставки замовлення</text>

  <rect x="40" y="90" width="1700" height="210" class="lane"/>
  <rect x="40" y="300" width="1700" height="240" class="lane"/>
  <line x1="190" y1="90" x2="190" y2="540" stroke="#475569" stroke-width="2"/>
  <text x="115" y="205" text-anchor="middle" class="lane-title">Менеджер</text>
  <text x="115" y="430" text-anchor="middle" class="lane-title">Комірник</text>

  <circle cx="245" cy="195" r="22" class="event"/>
  <text x="245" y="250" text-anchor="middle" class="small">
    <tspan x="245" dy="0">Потрібно створити</tspan>
    <tspan x="245" dy="20">замовлення</tspan>
  </text>

  <rect x="330" y="155" width="150" height="80" class="task"/>
  <text x="405" y="188" text-anchor="middle" class="label">
    <tspan x="405" dy="0">Створити</tspan>
    <tspan x="405" dy="22">замовлення</tspan>
  </text>

  <rect x="540" y="155" width="170" height="80" class="task"/>
  <text x="625" y="180" text-anchor="middle" class="label">
    <tspan x="625" dy="0">Надіслати</tspan>
    <tspan x="625" dy="22">замовлення</tspan>
    <tspan x="625" dy="22">підряднику</tspan>
  </text>

  <polygon points="810,155 850,195 810,235 770,195" class="gateway"/>
  <circle cx="810" cy="195" r="16" fill="none" stroke="#1f2937" stroke-width="2"/>
  <polygon points="810,178 824,187 824,203 810,212 796,203 796,187" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="810" y="258" text-anchor="middle" class="small">
    <tspan x="810" dy="0">Очікувати доставку</tspan>
    <tspan x="810" dy="20">або строк</tspan>
  </text>

  <circle cx="975" cy="405" r="22" class="event"/>
  <text x="975" y="410" text-anchor="middle" class="icon">✉</text>
  <text x="975" y="460" text-anchor="middle" class="small">Замовлення доставлено</text>

  <circle cx="975" cy="195" r="22" class="event"/>
  <text x="975" y="202" text-anchor="middle" class="icon">◷</text>
  <text x="975" y="250" text-anchor="middle" class="small">Строк доставки минув</text>

  <rect x="1080" y="155" width="190" height="80" class="task"/>
  <text x="1175" y="178" text-anchor="middle" class="label">
    <tspan x="1175" dy="0">Зв'язатися</tspan>
    <tspan x="1175" dy="22">з транспортною</tspan>
    <tspan x="1175" dy="22">компанією</tspan>
  </text>

  <polygon points="1370,155 1410,195 1370,235 1330,195" class="gateway"/>
  <text x="1370" y="203" text-anchor="middle" class="icon">×</text>
  <text x="1370" y="260" text-anchor="middle" class="small">
    <tspan x="1370" dy="0">Рішення після</tspan>
    <tspan x="1370" dy="20">відповіді компанії</tspan>
  </text>

  <circle cx="1585" cy="195" r="22" class="event end"/>
  <text x="1585" y="250" text-anchor="middle" class="small">Припинити очікування</text>

  <rect x="1080" y="365" width="190" height="80" class="task"/>
  <text x="1175" y="398" text-anchor="middle" class="label">
    <tspan x="1175" dy="0">Перевірити</tspan>
    <tspan x="1175" dy="22">доставлені товари</tspan>
  </text>

  <polygon points="1370,365 1410,405 1370,445 1330,405" class="gateway"/>
  <text x="1370" y="413" text-anchor="middle" class="icon">×</text>
  <text x="1370" y="470" text-anchor="middle" class="small">
    <tspan x="1370" dy="0">Товари відповідають</tspan>
    <tspan x="1370" dy="20">замовленню?</tspan>
  </text>

  <rect x="1480" y="365" width="150" height="80" class="task"/>
  <text x="1555" y="398" text-anchor="middle" class="label">
    <tspan x="1555" dy="0">Прийняти</tspan>
    <tspan x="1555" dy="22">доставку</tspan>
  </text>

  <rect x="1480" y="475" width="150" height="55" class="task"/>
  <text x="1555" y="497" text-anchor="middle" class="label">
    <tspan x="1555" dy="0">Не приймати</tspan>
    <tspan x="1555" dy="22">доставку</tspan>
  </text>

  <rect x="1660" y="365" width="95" height="80" class="task"/>
  <text x="1707" y="398" text-anchor="middle" class="small">
    <tspan x="1707" dy="0">Повідомити</tspan>
    <tspan x="1707" dy="20">менеджера</tspan>
  </text>

  <circle cx="1707" cy="502" r="20" class="event end"/>
  <text x="1707" y="552" text-anchor="middle" class="small">Доставку відхилено</text>

  <circle cx="1707" cy="320" r="20" class="event end"/>
  <text x="1707" y="340" text-anchor="middle" class="small">Доставку прийнято</text>

  <path class="flow" d="M267 195 H330"/>
  <path class="flow" d="M480 195 H540"/>
  <path class="flow" d="M710 195 H770"/>
  <path class="flow" d="M850 195 H953"/>
  <text x="900" y="182" text-anchor="middle" class="small">строк минув</text>
  <path class="flow" d="M850 205 C890 260 910 350 953 395"/>
  <text x="905" y="355" text-anchor="middle" class="small">доставлено</text>
  <path class="flow" d="M997 195 H1080"/>
  <path class="flow" d="M1270 195 H1330"/>
  <path class="flow" d="M1410 195 H1563"/>
  <text x="1490" y="182" text-anchor="middle" class="small">припинити</text>
  <path class="flow" d="M1370 155 V115 H810 V155"/>
  <text x="1090" y="105" text-anchor="middle" class="small">чекати доставку</text>
  <path class="flow" d="M997 405 H1080"/>
  <path class="flow" d="M1270 405 H1330"/>
  <path class="flow" d="M1410 405 H1480"/>
  <text x="1445" y="392" text-anchor="middle" class="small">так</text>
  <path class="flow" d="M1555 445 V475"/>
  <text x="1578" y="463" class="small">ні</text>
  <path class="flow" d="M1630 405 H1660"/>
  <path class="flow" d="M1707 365 V340"/>
  <path class="flow" d="M1630 502 H1687"/>
</svg>
